<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 允许手机双指缩放 -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=6, user-scalable=yes, viewport-fit=cover">
<title>Wenfeng Zou · CV</title>
<meta name="description" content="Curriculum Vitae">
<style>
  *{ -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:#fff; min-height:100%; }

  #viewer{ padding:12px; box-sizing:border-box; }
  .page{ position:relative; margin:0 auto 12px; background:#fff;
         box-shadow:0 0 0 1px rgba(0,0,0,.10), 0 1px 6px rgba(0,0,0,.10);
         overflow:hidden; }
  .page canvas{ display:block; width:100%; height:100%; }

  /* 文字层：透明文字盖在图像上 → 可选中/复制/搜索 */
  .textLayer{ position:absolute; inset:0; overflow:hidden; line-height:1;
    text-align:initial; transform-origin:0 0; z-index:2;
    -webkit-text-size-adjust:none; text-size-adjust:none; forced-color-adjust:none; }
  .textLayer span,.textLayer br{ color:transparent; position:absolute;
    white-space:pre; cursor:text; transform-origin:0% 0%; }
  .textLayer span.markedContent{ top:0; height:0; }
  .textLayer ::selection{ background:rgba(0,120,255,.35); }
  .textLayer br::selection{ background:transparent; }

  /* 链接层：PDF 里的超链接可点击 */
  .linkLayer{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  .linkLayer a{ position:absolute; display:block; pointer-events:auto; border-radius:2px; }
  .linkLayer a:hover{ background:rgba(255,200,0,.25); }

  /* 右下角缩放按钮 */
  #bar{ position:fixed; z-index:10; display:flex; gap:6px; opacity:.5;
        right:calc(10px + env(safe-area-inset-right));
        bottom:calc(10px + env(safe-area-inset-bottom)); transition:opacity .2s; }
  #bar:hover{ opacity:1; }
  #bar button{ width:38px; height:38px; border:0; border-radius:19px; cursor:pointer;
        background:rgba(0,0,0,.6); color:#fff; font-size:18px; line-height:1; }
  #msg{ color:#666; font:14px/1.7 system-ui,-apple-system,sans-serif; text-align:center; padding:48px 16px; }
</style>
</head>
<body>

<div id="viewer"><div id="msg">正在加载…</div></div>
<div id="bar">
  <button id="zo" title="缩小">−</button>
  <button id="zf" title="适应宽度">⤢</button>
  <button id="zi" title="放大">＋</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
(function () {
  /* ======== 只需要改这两行 ======== */
  const FILE = 'cv.pdf';   // 你的 PDF 文件名
  const MAXW = 1100;       // 桌面端页面最大显示宽度(px)
  /* ================================ */

  const CDN = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174';
  pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + '/build/pdf.worker.min.js';

  const viewer = document.getElementById('viewer');
  let pdfDoc = null, items = [], zoom = 1, gen = 0;

  const availWidth = () => Math.min(viewer.clientWidth - 24, MAXW);

  // 光栅化倍率：高分屏更清晰；手机双指放大后再重绘，放大也不糊
  function outScale(W, H) {
    const vs  = window.visualViewport ? window.visualViewport.scale : 1;
    const dpr = window.devicePixelRatio || 1;
    let os = Math.min(3, Math.max(1, dpr * vs));
    const MAXPX = 12e6;                       // iOS canvas 像素上限保护
    if (W * H * os * os > MAXPX) os = Math.sqrt(MAXPX / (W * H));
    return os;
  }

  async function main() {
    pdfDoc = await pdfjsLib.getDocument({
      url: FILE,
      cMapUrl: CDN + '/cmaps/', cMapPacked: true,      // 中文/日文字体支持
      standardFontDataUrl: CDN + '/standard_fonts/'
    }).promise;

    viewer.innerHTML = '';
    for (let n = 1; n <= pdfDoc.numPages; n++) {
      const page = await pdfDoc.getPage(n);
      const div = document.createElement('div'); div.className = 'page';
      const canvas = document.createElement('canvas');
      const text = document.createElement('div');  text.className  = 'textLayer';
      const links = document.createElement('div'); links.className = 'linkLayer';
      div.append(canvas, text, links);
      viewer.appendChild(div);
      items.push({ page, div, canvas, text, links, task: null, scale: 1, renderedScale: 0 });
    }
    await layout();
  }

  // 只负责改尺寸 + 触发重绘；不做任何清空可见画布的操作
  async function layout() {
    const w = availWidth() * zoom;
    for (const it of items) {
      it.scale = w / it.page.getViewport({ scale: 1 }).width;

      const vp = it.page.getViewport({ scale: it.scale });
      it.div.style.width  = Math.round(vp.width)  + 'px';
      it.div.style.height = Math.round(vp.height) + 'px';
      it.div.style.setProperty('--scale-factor', it.scale);   // pdf.js 文本层必需
      // 旧位图此时被 CSS 拉伸，只是短暂变模糊，不会出现空白闪烁
    }
    await renderAll();
  }

  async function renderAll() {
    const g = ++gen;
    for (const it of items) {
      if (g !== gen) return;
      await renderOne(it, g);
    }
  }

  async function renderOne(it, g) {
    const viewport = it.page.getViewport({ scale: it.scale });
    const W = Math.round(viewport.width), H = Math.round(viewport.height);
    const os = outScale(W, H);
    const pw = Math.round(W * os), ph = Math.round(H * os);

    // 尺寸没变（例如缩小后又放大回同一档）→ 直接复用已有位图
    if (it.renderedScale === it.scale &&
        it.canvas.width === pw && it.canvas.height === ph) return;

    // 1) 渲染到离屏 canvas，正在显示的 canvas 全程不受影响
    const off = document.createElement('canvas');
    off.width  = pw;
    off.height = ph;

    if (it.task) { try { it.task.cancel(); } catch (_) {} it.task = null; }

    const task = it.page.render({
      canvasContext: off.getContext('2d', { alpha: false }),
      viewport,
      transform: os !== 1 ? [os, 0, 0, os, 0, 0] : null
    });
    it.task = task;

    try {
      await task.promise;
    } catch (e) {
      if (e && e.name === 'RenderingCancelledException') return;
      console.error(e);
      return;
    }
    if (it.task === task) it.task = null;
    if (g !== gen) return;            // 期间又缩放/改窗口了，丢弃这次结果

    // 2) 原子替换：同步执行，一帧内完成，中间不会出现空白
    off.style.cssText = it.canvas.style.cssText;
    it.canvas.replaceWith(off);
    it.canvas = off;
    it.renderedScale = it.scale;

    // 3) 文本层（透明内容，清空重建不影响视觉）
    it.text.innerHTML = '';
    const tc = await it.page.getTextContent();
    if (g !== gen) return;
    await pdfjsLib.renderTextLayer({
      textContentSource: tc, container: it.text, viewport, textDivs: []
    }).promise;

    // 4) 链接层
    if (g !== gen) return;
    await buildLinks(it, viewport);
  }

  async function buildLinks(it, viewport) {
    it.links.innerHTML = '';
    const annots = await it.page.getAnnotations({ intent: 'display' });
    for (const a of annots) {
      if (a.subtype !== 'Link' || (!a.url && !a.dest)) continue;
      const r = viewport.convertToViewportRectangle(a.rect);
      const x1 = Math.min(r[0], r[2]), y1 = Math.min(r[1], r[3]);
      const x2 = Math.max(r[0], r[2]), y2 = Math.max(r[1], r[3]);
      const el = document.createElement('a');
      el.style.cssText = `left:${x1}px;top:${y1}px;width:${x2-x1}px;height:${y2-y1}px`;
      if (a.url) {                       // 外部链接 / mailto
        el.href = a.url; el.target = '_blank'; el.rel = 'noopener noreferrer'; el.title = a.url;
      } else {                           // PDF 内部跳转
        el.href = '#';
        el.addEventListener('click', async ev => {
          ev.preventDefault();
          const d = typeof a.dest === 'string' ? await pdfDoc.getDestination(a.dest) : a.dest;
          if (!d) return;
          const i = await pdfDoc.getPageIndex(d[0]);
          items[i] && items[i].div.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      }
      it.links.appendChild(el);
    }
  }

  // 缩放按钮
  zi.onclick = () => { zoom = Math.min(zoom * 1.25, 5);   layout(); };
  zo.onclick = () => { zoom = Math.max(zoom / 1.25, 0.4); layout(); };
  zf.onclick = () => { zoom = 1; layout(); };

  // 窗口尺寸 / 浏览器缩放变化 → 重新排版
  let t1; window.addEventListener('resize', () => { clearTimeout(t1); t1 = setTimeout(layout, 200); });
  window.addEventListener('orientationchange', () => setTimeout(layout, 300));

  // 手机双指缩放结束后重绘，保证放大后依然清晰
  if (window.visualViewport) {
    let t2, last = 1;
    const on = () => { clearTimeout(t2); t2 = setTimeout(() => {
      const s = visualViewport.scale;
      if (Math.abs(s - last) > 0.15) { last = s; renderAll(); }
    }, 300); };
    visualViewport.addEventListener('resize', on);
    visualViewport.addEventListener('scroll', on);
  }

  main().catch(e => {
    viewer.innerHTML = '<div id="msg">加载失败：' + (e && e.message ? e.message : e) +
      '<br>请检查文件名是否为 <code>' + FILE + '</code>（区分大小写）。</div>';
  });
})();
</script>
</body>
</html>
